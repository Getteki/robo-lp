<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robo LP</title>
<style>
  :root {
    --bg-top: #eef1fb;
    --bg-bottom: #d8e0f5;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  body {
    background: radial-gradient(120% 120% at 50% 20%, var(--bg-top), var(--bg-bottom));
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  #stage {
    position: fixed;
    inset: 0;
  }

  #stage canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .hint {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    color: #5a6485;
    font-size: 13px;
    letter-spacing: 0.02em;
    opacity: 0.6;
    pointer-events: none;
  }
</style>
</head>
<body>

  <div id="stage"></div>
  <div class="hint">mova o mouse — o robô está de olho em você</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const stage = document.getElementById('stage');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

    function showFallback() {
      stage.innerHTML = '';
      stage.style.display = 'flex';
      stage.style.alignItems = 'center';
      stage.style.justifyContent = 'center';
      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:relative;width:min(60vw,620px);aspect-ratio:1/1;';
      wrap.innerHTML =
        '<img src="assets/body.png" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;">' +
        '<img src="assets/head.png" style="position:absolute;top:0;left:30.70%;width:31.50%;height:23.92%;object-fit:contain;">';
      stage.appendChild(wrap);
    }

    if (!window.WebGLRenderingContext) {
      showFallback();
      throw new Error('WebGL not supported');
    }

    // ---------- renderer / scene / camera ----------
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true });
    } catch (e) {
      showFallback();
      throw e;
    }
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    stage.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    function makeBackgroundTexture() {
      const c = document.createElement('canvas');
      c.width = 8; c.height = 512;
      const ctx = c.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 0, c.height);
      grad.addColorStop(0, '#eef1fb');
      grad.addColorStop(1, '#c9d4ee');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, c.width, c.height);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    scene.background = makeBackgroundTexture();

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
    camera.position.set(0, 0.05, 13);

    const BLOOM_LAYER = 1;
    const bloomLayer = new THREE.Layers();
    bloomLayer.set(BLOOM_LAYER);

    // ---------- lights ----------
    const hemi = new THREE.HemisphereLight(0xdfe6ff, 0x2a2033, 0.6);
    scene.add(hemi);

    const key = new THREE.DirectionalLight(0xffffff, 1.3);
    key.position.set(2.4, 3.2, 3.4);
    key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    key.shadow.camera.near = 1;
    key.shadow.camera.far = 12;
    key.shadow.radius = 4;
    scene.add(key);

    const rim = new THREE.DirectionalLight(0x6ad7ff, 1.1);
    rim.position.set(-3, 1.2, -2.6);
    scene.add(rim);

    const fill = new THREE.DirectionalLight(0xaebbff, 0.35);
    fill.position.set(-2, -1, 2.5);
    scene.add(fill);

    // ---------- materials ----------
    const shellMat = new THREE.MeshPhysicalMaterial({
      color: 0xf1eff5,
      roughness: 0.35,
      metalness: 0.05,
      clearcoat: 0.6,
      clearcoatRoughness: 0.25,
    });

    const shellShadowMat = new THREE.MeshPhysicalMaterial({
      color: 0xd8d5e0,
      roughness: 0.4,
      metalness: 0.05,
      clearcoat: 0.4,
    });

    const darkPlasticMat = new THREE.MeshPhysicalMaterial({
      color: 0x1b1b22,
      roughness: 0.55,
      metalness: 0.1,
      clearcoat: 0.3,
    });

    const jacketMat = new THREE.MeshStandardMaterial({
      color: 0x17171d,
      roughness: 0.75,
      metalness: 0.02,
    });

    const collarMat = new THREE.MeshStandardMaterial({
      color: 0xe9e7ee,
      roughness: 0.7,
      metalness: 0.0,
    });

    const pantsMat = new THREE.MeshStandardMaterial({
      color: 0x1c1c22,
      roughness: 0.8,
      metalness: 0.02,
    });

    const soleMat = new THREE.MeshStandardMaterial({
      color: 0x2a2a30,
      roughness: 0.7,
      metalness: 0.02,
    });

    // ---------- face texture (screen) ----------
    function makeFaceTexture() {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 384;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#050609';
      ctx.fillRect(0, 0, c.width, c.height);

      const grad = ctx.createRadialGradient(256, 150, 20, 256, 150, 320);
      grad.addColorStop(0, '#0c2230');
      grad.addColorStop(1, '#050609');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, c.width, c.height);

      ctx.strokeStyle = '#7ee8ff';
      ctx.lineWidth = 20;
      ctx.lineCap = 'round';
      ctx.shadowColor = '#7ee8ff';
      ctx.shadowBlur = 40;

      ctx.beginPath();
      ctx.arc(185, 190, 55, Math.PI * 1.12, Math.PI * 1.88);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(340, 190, 55, Math.PI * 1.12, Math.PI * 1.88);
      ctx.stroke();

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const faceTex = makeFaceTexture();
    const screenMat = new THREE.MeshStandardMaterial({
      map: faceTex,
      emissive: 0xffffff,
      emissiveMap: faceTex,
      emissiveIntensity: 1.6,
      roughness: 0.3,
      metalness: 0.0,
    });

    // ---------- head group ----------
    const headPivot = new THREE.Group();
    headPivot.position.y = 2.05;
    scene.add(headPivot);

    const headMesh = new THREE.Group();
    headPivot.add(headMesh);

    const shell = new THREE.Mesh(new RoundedBoxGeometry(1.9, 1.55, 1.6, 6, 0.18), shellMat);
    shell.castShadow = true;
    shell.receiveShadow = true;
    headMesh.add(shell);

    const screen = new THREE.Mesh(new RoundedBoxGeometry(1.35, 1.05, 0.08, 4, 0.06), screenMat);
    screen.position.set(0.12, 0.05, 0.82);
    screen.layers.enable(BLOOM_LAYER);
    headMesh.add(screen);

    const bezel = new THREE.Mesh(new RoundedBoxGeometry(1.5, 1.2, 0.06, 4, 0.08), shellShadowMat);
    bezel.position.set(0.12, 0.05, 0.78);
    headMesh.add(bezel);

    // side vents
    const ventGroup = new THREE.Group();
    for (let i = 0; i < 6; i++) {
      const vent = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.05, 0.9), darkPlasticMat);
      vent.position.set(-0.78, 0.42 - i * 0.14, 0.05);
      ventGroup.add(vent);
    }
    headMesh.add(ventGroup);

    // bottom control strip
    const strip = new THREE.Mesh(new RoundedBoxGeometry(0.5, 0.07, 0.05, 3, 0.02), darkPlasticMat);
    strip.position.set(0.02, -0.42, 0.83);
    headMesh.add(strip);

    const powerLight = new THREE.Mesh(
      new THREE.SphereGeometry(0.045, 16, 16),
      new THREE.MeshStandardMaterial({ color: 0x2fd9ff, emissive: 0x2fd9ff, emissiveIntensity: 3 })
    );
    powerLight.position.set(0.5, -0.42, 0.82);
    powerLight.layers.enable(BLOOM_LAYER);
    headMesh.add(powerLight);

    const dot = new THREE.Mesh(
      new THREE.SphereGeometry(0.03, 12, 12),
      new THREE.MeshStandardMaterial({ color: 0x333340 })
    );
    dot.position.set(0.34, -0.42, 0.82);
    headMesh.add(dot);

    // neck
    const neck = new THREE.Mesh(
      new THREE.CylinderGeometry(0.26, 0.3, 0.5, 20),
      darkPlasticMat
    );
    neck.position.y = -1.05;
    neck.castShadow = true;
    headMesh.add(neck);

    // ---------- body (static): torso, arms, legs ----------
    const body = new THREE.Group();
    scene.add(body);

    const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.62, 0.35, 24, 1, true), collarMat);
    collar.position.y = 0.85;
    collar.receiveShadow = true;
    body.add(collar);

    // torso silhouette: shoulders wide, waist narrower, slight hip flare —
    // a plain cone/cylinder reads as a lampshade, not a body.
    const torsoProfile = [
      [0.66, -0.775],
      [0.60, -0.55],
      [0.58, -0.30],
      [0.66, 0.05],
      [0.85, 0.35],
      [1.00, 0.58],
      [1.04, 0.66],
      [0.82, 0.775],
    ].map(([x, y]) => new THREE.Vector2(x, y));
    const torso = new THREE.Mesh(new THREE.LatheGeometry(torsoProfile, 24), jacketMat);
    torso.receiveShadow = true;
    torso.castShadow = true;
    body.add(torso);

    const hips = new THREE.Mesh(
      new THREE.CylinderGeometry(0.62, 0.56, 0.35, 20),
      pantsMat
    );
    hips.position.y = -0.95;
    hips.castShadow = true;
    hips.receiveShadow = true;
    body.add(hips);

    const accentRing = new THREE.Mesh(
      new THREE.TorusGeometry(0.16, 0.02, 12, 32),
      new THREE.MeshStandardMaterial({ color: 0x2fd9ff, emissive: 0x2fd9ff, emissiveIntensity: 2.2 })
    );
    accentRing.position.set(-0.55, 0.35, 0.6);
    accentRing.layers.enable(BLOOM_LAYER);
    body.add(accentRing);

    // ---------- legs ----------
    function buildLeg(side) {
      const leg = new THREE.Group();
      leg.position.set(side * 0.34, -1.0, 0);

      const hipCap = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), pantsMat);
      leg.add(hipCap);

      const upperLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.27, 0.22, 0.85, 16), pantsMat);
      upperLeg.position.y = -0.6;
      upperLeg.castShadow = true;
      leg.add(upperLeg);

      const knee = new THREE.Mesh(new THREE.SphereGeometry(0.205, 16, 16), pantsMat);
      knee.position.y = -1.0;
      knee.castShadow = true;
      leg.add(knee);

      const lowerLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.16, 0.8, 16), pantsMat);
      lowerLeg.position.y = -1.4;
      lowerLeg.castShadow = true;
      leg.add(lowerLeg);

      const shoe = new THREE.Mesh(new RoundedBoxGeometry(0.42, 0.24, 0.68, 3, 0.08), collarMat);
      shoe.position.set(0, -1.85, 0.14);
      shoe.castShadow = true;
      shoe.receiveShadow = true;
      leg.add(shoe);

      const sole = new THREE.Mesh(new RoundedBoxGeometry(0.44, 0.08, 0.7, 2, 0.03), soleMat);
      sole.position.set(0, -1.97, 0.14);
      leg.add(sole);

      return leg;
    }
    body.add(buildLeg(1));
    body.add(buildLeg(-1));

    // ---------- arms ----------
    function buildArm({ side, shoulderRotZ, elbowRotZ, elbowRotX }) {
      const shoulder = new THREE.Group();
      shoulder.position.set(side * 1.15, 0.6, 0);
      shoulder.rotation.z = shoulderRotZ;

      const shoulderCap = new THREE.Mesh(new THREE.SphereGeometry(0.19, 16, 16), jacketMat);
      shoulderCap.castShadow = true;
      shoulder.add(shoulderCap);

      const upperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.125, 0.75, 14), jacketMat);
      upperArm.position.y = -0.375;
      upperArm.castShadow = true;
      shoulder.add(upperArm);

      const elbow = new THREE.Group();
      elbow.position.y = -0.75;
      elbow.rotation.z = elbowRotZ;
      elbow.rotation.x = elbowRotX || 0;
      shoulder.add(elbow);

      const elbowCap = new THREE.Mesh(new THREE.SphereGeometry(0.135, 14, 14), jacketMat);
      elbowCap.castShadow = true;
      elbow.add(elbowCap);

      const forearm = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 0.65, 14), jacketMat);
      forearm.position.y = -0.325;
      forearm.castShadow = true;
      elbow.add(forearm);

      const hand = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 16), collarMat);
      hand.position.y = -0.68;
      hand.castShadow = true;
      elbow.add(hand);

      return shoulder;
    }

    // right side (viewer's right): raised, gesturing arm
    body.add(buildArm({ side: 1, shoulderRotZ: 2.15, elbowRotZ: -1.3, elbowRotX: 0 }));
    // left side: relaxed arm, hand tucked toward the hip
    body.add(buildArm({ side: -1, shoulderRotZ: 0.18, elbowRotZ: -0.05, elbowRotX: 0.35 }));

    // ---------- ground shadow catcher ----------
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(5, 48),
      new THREE.ShadowMaterial({ opacity: 0.18 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -3.02;
    ground.receiveShadow = true;
    scene.add(ground);

    // ---------- postprocessing: selective bloom ----------
    // only objects on BLOOM_LAYER (screen face, power light, accent ring) glow.
    // technique: render scene with everything else painted flat black, extract
    // bright spots with UnrealBloomPass, then composite that on top of the
    // normal full-color render.
    const darkMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });
    const materialCache = {};

    function darkenNonBloomed(obj) {
      if (obj.isMesh && bloomLayer.test(obj.layers) === false) {
        materialCache[obj.uuid] = obj.material;
        obj.material = darkMaterial;
      }
    }
    function restoreMaterial(obj) {
      if (materialCache[obj.uuid]) {
        obj.material = materialCache[obj.uuid];
        delete materialCache[obj.uuid];
      }
    }

    const bloomComposer = new EffectComposer(renderer);
    bloomComposer.renderToScreen = false;
    bloomComposer.addPass(new RenderPass(scene, camera));
    bloomComposer.addPass(new UnrealBloomPass(new THREE.Vector2(1, 1), 0.75, 0.4, 0.1));

    const mixPass = new ShaderPass(
      new THREE.ShaderMaterial({
        uniforms: {
          baseTexture: { value: null },
          bloomTexture: { value: bloomComposer.renderTarget2.texture },
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D baseTexture;
          uniform sampler2D bloomTexture;
          varying vec2 vUv;
          void main() {
            gl_FragColor = texture2D(baseTexture, vUv) + texture2D(bloomTexture, vUv);
          }
        `,
      }),
      'baseTexture'
    );
    mixPass.needsSwap = true;

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    composer.addPass(mixPass);

    function renderWithBloom() {
      const bg = scene.background;
      scene.background = null;
      scene.traverse(darkenNonBloomed);
      bloomComposer.render();
      scene.traverse(restoreMaterial);
      scene.background = bg;
      composer.render();
    }

    // ---------- resize ----------
    function resize() {
      const w = stage.clientWidth, h = stage.clientHeight;
      renderer.setSize(w, h, false);
      composer.setSize(w, h);
      bloomComposer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize);
    resize();

    // ---------- interaction ----------
    let targetX = 0, targetY = 0;
    let curX = 0, curY = 0;

    if (!reduceMotion) {
      addEventListener('pointermove', (e) => {
        targetX = (e.clientX / innerWidth) * 2 - 1;
        targetY = (e.clientY / innerHeight) * 2 - 1;
      });
    }

    let visible = true;
    new IntersectionObserver(([entry]) => { visible = entry.isIntersecting; }).observe(stage);

    const clock = new THREE.Clock();

    function animate() {
      if (visible && !document.hidden) {
        const t = clock.getElapsedTime();

        curX += (targetX - curX) * 0.07;
        curY += (targetY - curY) * 0.07;

        const idleBob = reduceMotion ? 0 : Math.sin(t * 1.1) * 0.015;
        headPivot.rotation.y = curX * 0.5;
        headPivot.rotation.x = -curY * 0.32 + idleBob;
        headPivot.position.x = curX * 0.12;

        body.rotation.y = curX * 0.08;

        camera.position.x = curX * 0.35;
        camera.position.y = 0.05 - curY * 0.15;
        camera.lookAt(0, -0.1, 0);

        renderWithBloom();
      }
      requestAnimationFrame(animate);
    }

    animate();
  </script>

</body>
</html>
